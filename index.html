<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金价查询仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        /* --- 保持之前的CSS样式不变 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(to right, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #ccc;
            font-size: 1.1em;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 1.3em;
            color: #FFD700;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .price-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .price-label {
            color: #aaa;
        }

        .price-value {
            font-weight: bold;
            font-size: 1.2em;
            color: #FFD700;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.1em;
            font-weight: bold;
        }

        .chart-container {
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
        }

        .loading {
            text-align: center;
            color: #999;
            font-size: 1.1em;
            padding: 40px;
        }

        .error {
            color: #ff4444;
            text-align: center;
            padding: 20px;
            background: rgba(255, 68, 68, 0.1);
            border-radius: 10px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>金价查询仪表盘</h1>
            <div class="subtitle">实时黄金价格监控系统</div>
        </header>

        <div id="error-container"></div>

        <div class="dashboard">
            <!-- 金价概览卡片 -->
            <div class="card">
                <div class="card-title">金价概览</div>
                <div id="price-overview">
                    <div class="loading">正在加载金价数据...</div>
                </div>
            </div>

            <!-- 统计信息卡片 -->
            <div class="card">
                <div class="card-title">市场统计</div>
                <div id="market-stats">
                    <div class="loading">正在加载统计信息...</div>
                </div>
            </div>

            <!-- 价格走势图卡片 -->
            <div class="card">
                <div class="card-title">价格走势图</div>
                <div id="chart" class="chart-container"></div>
            </div>
        </div>

        <footer style="text-align: center; color: #666; font-size: 0.9em; margin-top: 30px;">
            <p>数据来源：世界黄金协会 | 更新时间: <span id="update-time"></span></p>
        </footer>
    </div>

    <script>
        // DOM 元素
        const priceOverview = document.getElementById('price-overview');
        const marketStats = document.getElementById('market-stats');
        const chartContainer = document.getElementById('chart');
        const errorContainer = document.getElementById('error-container');
        const updateTime = document.getElementById('update-time');

        // 接口配置
        const API_URL = 'https://fsapi-china.gold.org/api/goldprice/v13/widget/1d/CNY';
        const API_PARAMS = new URLSearchParams({
            currency: 'CNY',
            weight: 'grams'
        });

        // 初始化图表
        let chartInstance = null;

        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // 获取金价数据
        async function fetchGoldPrice() {
            try {
                // 显示加载状态
                priceOverview.innerHTML = '<div class="loading">正在获取数据...</div>';
                marketStats.innerHTML = '<div class="loading">正在计算统计...</div>';
                
                // 清除之前的错误
                errorContainer.innerHTML = '';

                console.log('正在请求API:', `${API_URL}?${API_PARAMS}`);
                
                // 发送请求
                // 注意：这里去掉了复杂的headers，因为API似乎不需要特定的headers
                const response = await fetch(`${API_URL}?${APIParams}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('API 响应:', data);

                // 更新页面
                updateUI(data);
                
            } catch (error) {
                console.error('获取金价失败:', error);
                const errorMsg = `
                    <div class="error">
                        <p>❌ 数据加载失败: ${error.message}</p>
                        <p>请尝试刷新页面，或检查您的网络连接。</p>
                        <p><small>提示：请确保您是通过本地服务器（如Live Server）运行此页面，而不是直接双击打开。</small></p>
                    </div>
                `;
                errorContainer.innerHTML = errorMsg;
                priceOverview.innerHTML = '<div class="error">加载失败</div>';
                marketStats.innerHTML = '<div class="error">加载失败</div>';
            }
        }

        // 更新UI
        function updateUI(data) {
            try {
                const { system, chartData } = data;
                const { seriesDataDates, grams } = chartData;
                
                // 获取最新价格数据
                const prices = grams.series.CNY.data;
                const latestPrice = prices[prices.length - 1];
                const previousPrice = prices[prices.length - 2] || latestPrice;
                
                // 计算涨跌幅
                const change = latestPrice - previousPrice;
                const changePercent = ((change / previousPrice) * 100).toFixed(2);
                
                // 更新概览
                priceOverview.innerHTML = `
                    <div class="price-info">
                        <span class="price-label">当前金价 (CNY/克):</span>
                        <span class="price-value">${latestPrice.toFixed(3)}</span>
                    </div>
                    <div class="price-info">
                        <span class="price-label">价格变动:</span>
                        <span class="price-value" style="color: ${change >= 0 ? '#00ff8c' : '#ff4444'}">
                            ${change >= 0 ? '↑' : '↓'} ${Math.abs(change).toFixed(3)} (${changePercent}%) 
                        </span>
                    </div>
                    <div class="price-info">
                        <span class="price-label">数据时间:</span>
                        <span class="price-value">${formatDate(seriesDataDates[seriesDataDates.length - 1])}</span>
                    </div>
                `;

                // 更新统计信息
                const maxPrice = Math.max(...prices);
                const minPrice = Math.min(...prices);
                const avgPrice = (prices.reduce((a, b) => a + b, 0) / prices.length).toFixed(3);
                
                marketStats.innerHTML = `
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-label">今日最高</div>
                            <div class="stat-value" style="color: #00ff8c">${maxPrice.toFixed(3)}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">今日最低</div>
                            <div class="stat-value" style="color: #ff4444">${minPrice.toFixed(3)}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">平均价格</div>
                            <div class="stat-value">${avgUp.toFixed(3)}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">数据点数</div>
                            <div class="stat-value">${prices.length}</div>
                        </div>
                    </div>
                `;

                // 初始化图表
                if (!chartInstance) {
                    chartInstance = echarts.init(chartContainer);
                }

                // 准备图表数据
                const chartOptions = {
                    tooltip: {
                        trigger: 'axis',
                        formatter: function(params) {
                            return `
                                时间: ${formatDate(params[0].name)}<br/>
                                价格: ${params[0].value} CNY/克
                            `;
                        }
                    },
                    grid: {
                        left: '10%',
                        right: '10%',
                        bottom: '15%',
                        top: '20%'
                    },
                    xAxis: {
                        type: 'category',
                        data: seriesDataDates,
                        axisLabel: {
                            color: '#999',
                            fontSize: 10,
                            rotate: 45
                        },
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#333'
                            }
                        }
                    },
                    yAxis: {
                        type: 'value',
                        name: '价格 (CNY/克)',
                        axisLabel: {
                            color: '#999',
                            formatter: '{value}'
                        },
                        splitLine: {
                            lineStyle: {
                                color: '#333'
                            }
                        }
                    },
                    series: [{
                        name: '金价',
                        type: 'line',
                        data: prices,
                        smooth: true,
                        symbol: 'none',
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                {offset: 0, color: 'rgba(255, 215, 0, 0.3)'},
                                {offset: 1, color: 'rgba(255, 215, 0, 0)'}
                            ])
                        },
                        lineStyle: {
                            color: '#FFD700',
                            width: 3
                        },
                        itemStyle: {
                            color: '#FFD700'
                        }
                    }]
                };

                chartInstance.setOption(chartOptions);

                // 更新时间
                updateTime.textContent = new Date().toLocaleString('zh-CN');

            } catch (error) {
                console.error('更新UI失败:', error);
                priceOverview.innerHTML = '<div class="error">数据解析失败</div>';
                marketStats.innerHTML = '<div class="error">数据解析失败</div>';
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            // 首次加载
            fetchGoldPrice();
            
            // 每5分钟自动刷新一次数据
            setInterval(fetchGoldPrice, 5 * 60 * 1000);
        });
    </script>
</body>
</html>
