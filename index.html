<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="糖果消消乐 - 简单好玩的消除小游戏">
  <title>糖果消消乐</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <!-- 左栏：标题 / 积分 / 进度 -->
    <aside class="side-panel left-panel">
      <h1 class="title">🍬 <span data-i18n="appTitle">糖果消消乐</span></h1>

      <div class="stats">
        <div class="stat">
          <span class="stat-label" data-i18n="statScore">得分</span>
          <span id="score" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label" data-i18n="statLevel">关卡</span>
          <span id="level" class="stat-value">1</span>
        </div>
        <div class="stat">
          <span class="stat-label" data-i18n="statMoves">剩余步数</span>
          <span id="moves" class="stat-value">30</span>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-label">
          <span data-i18n="targetLabel">本关目标</span>
          <span id="target">1000</span>
          <span data-i18n="pointsUnit">分</span>
        </div>
        <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
      </div>

      <div class="best-line">
        <span data-i18n="bestLabel">单关最高</span>：<b id="best">0</b>
      </div>

      <p class="bottom-hint" data-i18n="bottomHint">点击选中糖果，再点相邻糖果交换，也可以直接滑动</p>
    </aside>

    <!-- 中间：棋盘 -->
    <main id="boardArea" class="board-area">
      <div id="board" class="board" aria-label="游戏棋盘">
        <div id="toast" class="toast">
          <span id="toastPts" class="toast-pts"></span>
          <span id="toastCombo" class="toast-combo"></span>
        </div>
      </div>
    </main>

    <!-- 右栏：按钮 + 广告 -->
    <aside class="side-panel right-panel">
      <div class="controls">
        <button id="backBtn" type="button" data-i18n="btnBack">返回</button>
        <button id="hintBtn" type="button" data-i18n="btnHint">提示</button>
        <button id="shuffleBtn" type="button" data-i18n="btnShuffle">洗牌</button>
        <button id="restartBtn" type="button" data-i18n="btnRestart">重开</button>
        <button id="soundBtn" type="button" aria-label="声音开关">🔊</button>
      </div>

      <div id="adSlotRight" class="ad-slot" role="complementary" aria-label="广告位">
        <span class="ad-badge" data-i18n="adBadge">广告 AD</span>
        <div class="ad-placeholder">
          <span class="ad-main" data-i18n="adPlaceholder">广告位预留</span>
          <span class="ad-sub">Ad Slot 300×250</span>
        </div>
      </div>
    </aside>
  </div>

  <!-- 移动端底部广告 -->
  <div id="adSlotMobile" class="ad-slot mobile-ad" role="complementary" aria-label="广告位">
    <span class="ad-badge" data-i18n="adBadge">广告 AD</span>
    <div class="ad-placeholder">
      <span class="ad-main" data-i18n="adPlaceholder">广告位预留</span>
      <span class="ad-sub">Ad Slot 320×50</span>
    </div>
  </div>

  <!-- 主菜单 -->
  <div id="menuModal" class="modal">
    <div class="menu-card">
      <h2 class="menu-title">🍬 <span data-i18n="appTitle">糖果消消乐</span></h2>
      <p id="menuProgress" class="menu-progress"></p>
      <button id="playBtn" type="button" class="menu-btn primary" data-i18n="btnPlay">开始游戏</button>
      <button id="selectLevelBtn" type="button" class="menu-btn" data-i18n="btnSelectLevel">选择关卡</button>
      <button id="langBtnMenu" type="button" class="menu-btn" data-i18n="btnLanguage">语言</button>
    </div>
  </div>

  <!-- 关卡选择 -->
  <div id="levelModal" class="modal hidden">
    <div class="menu-card">
      <h2 class="menu-title" data-i18n="levelSelectTitle">选择关卡</h2>
      <div id="levelGrid" class="level-grid"></div>
      <p id="unlockTip" class="menu-progress"></p>
      <button id="levelBackBtn" type="button" class="menu-btn secondary" data-i18n="btnBack">返回</button>
    </div>
  </div>

  <!-- 语言选择 -->
  <div id="langModal" class="modal hidden">
    <div class="menu-card">
      <h2 class="menu-title" data-i18n="langTitle">选择语言</h2>
      <div id="langGrid" class="lang-grid"></div>
      <button id="langCloseBtn" type="button" class="menu-btn secondary" data-i18n="btnClose">关闭</button>
    </div>
  </div>

  <!-- 结算弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalText" class="modal-text"></div>
      <div class="modal-actions">
        <button id="modalPrimaryBtn" type="button" class="modal-btn">继续</button>
        <button id="modalSecondaryBtn" type="button" class="modal-btn ghost">返回选关</button>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
