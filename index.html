<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>强密码生成器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 28px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 22px;
      color: #1a1a1a;
      margin-bottom: 24px;
      text-align: center;
    }

    /* 密码展示区 */
    .password-display {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      position: relative;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      word-break: break-all;
    }

    .password-text {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 18px;
      color: #212529;
      flex: 1;
      margin-right: 12px;
      line-height: 1.5;
    }

    .copy-btn {
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: #357abd;
    }

    .copy-btn.copied {
      background: #52c41a;
    }

    /* 强度条 */
    .strength-bar {
      height: 6px;
      border-radius: 3px;
      background: #e9ecef;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s, background 0.3s;
    }

    .strength-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
    }

    /* 长度滑块 */
    .length-control {
      margin-bottom: 24px;
    }

    .length-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .length-header span {
      font-size: 14px;
      color: #333;
    }

    .length-value {
      font-size: 18px;
      font-weight: 600;
      color: #4a90d9;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #e9ecef;
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #4a90d9;
      cursor: pointer;
    }

    /* 选项复选框 */
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .option-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #4a90d9;
    }

    .option-item label {
      font-size: 14px;
      color: #333;
      cursor: pointer;
      user-select: none;
    }

    /* 生成按钮 */
    .generate-btn {
      width: 100%;
      padding: 14px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .generate-btn:hover {
      background: #357abd;
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    /* 手机端适配 */
    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 20px;
      }

      .password-text {
        font-size: 16px;
      }

      .copy-btn {
        padding: 6px 12px;
        font-size: 13px;
      }

      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 强密码生成器</h1>

    <!-- 密码展示 -->
    <div class="password-display">
      <div class="password-text" id="passwordText">点击生成</div>
      <button class="copy-btn" id="copyBtn" onclick="copyPassword()">复制</button>
    </div>

    <!-- 强度条 -->
    <div class="strength-label">
      <span>密码强度</span>
      <span id="strengthText">—</span>
    </div>
    <div class="strength-bar">
      <div class="strength-fill" id="strengthFill"></div>
    </div>

    <!-- 长度控制 -->
    <div class="length-control">
      <div class="length-header">
        <span>密码长度</span>
        <span class="length-value" id="lengthValue">16</span>
      </div>
      <input type="range" id="lengthSlider" min="6" max="64" value="16"
             oninput="updateLength(this.value)">
    </div>

    <!-- 字符选项 -->
    <div class="options">
      <div class="option-item">
        <input type="checkbox" id="uppercase" checked>
        <label for="uppercase">大写字母 (A-Z)</label>
      </div>
      <div class="option-item">
        <input type="checkbox" id="lowercase" checked>
        <label for="lowercase">小写字母 (a-z)</label>
      </div>
      <div class="option-item">
        <input type="checkbox" id="numbers" checked>
        <label for="numbers">数字 (0-9)</label>
      </div>
      <div class="option-item">
        <input type="checkbox" id="symbols" checked>
        <label for="symbols">特殊符号 (!@#$)</label>
      </div>
    </div>

    <!-- 生成按钮 -->
    <button class="generate-btn" onclick="generatePassword()">生成密码</button>
  </div>

  <script>
    const chars = {
      uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lowercase: 'abcdefghijklmnopqrstuvwxyz',
      numbers: '0123456789',
      symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    function updateLength(val) {
      document.getElementById('lengthValue').textContent = val;
    }

    function generatePassword() {
      const length = parseInt(document.getElementById('lengthSlider').value);
      const useUpper = document.getElementById('uppercase').checked;
      const useLower = document.getElementById('lowercase').checked;
      const useNumbers = document.getElementById('numbers').checked;
      const useSymbols = document.getElementById('symbols').checked;

      // 至少选一项
      if (!useUpper && !useLower && !useNumbers && !useSymbols) {
        alert('请至少选择一种字符类型');
        return;
      }

      // 构建字符池
      let pool = '';
      let guaranteed = [];
      if (useUpper) { pool += chars.uppercase; guaranteed.push(chars.uppercase); }
      if (useLower) { pool += chars.lowercase; guaranteed.push(chars.lowercase); }
      if (useNumbers) { pool += chars.numbers; guaranteed.push(chars.numbers); }
      if (useSymbols) { pool += chars.symbols; guaranteed.push(chars.symbols); }

      // 使用 Web Crypto API 生成密码学安全随机数
      const bytes = new Uint32Array(length);
      crypto.getRandomValues(bytes);

      // 先保证每种类型至少出现一次
      let password = [];
      guaranteed.forEach(set => {
        const randIndex = bytes[password.length] % set.length;
        password.push(set[randIndex]);
      });

      // 填充剩余长度
      for (let i = password.length; i < length; i++) {
        password.push(pool[bytes[i] % pool.length]);
      }

      // Fisher-Yates 洗牌
      for (let i = password.length - 1; i > 0; i--) {
        const j = bytes[i] % (i + 1);
        [password[i], password[j]] = [password[j], password[i]];
      }

      const pwd = password.join('');
      document.getElementById('passwordText').textContent = pwd;
      updateStrength(pwd, pool.length);
    }

    function updateStrength(password, poolSize) {
      const entropy = password.length * Math.log2(poolSize);
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthText');

      let percent, color, text;
      if (entropy < 28) {
        percent = 20; color = '#ff4d4f'; text = '极弱';
      } else if (entropy < 36) {
        percent = 40; color = '#ff7a45'; text = '弱';
      } else if (entropy < 60) {
        percent = 60; color = '#ffc53d'; text = '中等';
      } else if (entropy < 128) {
        percent = 80; color = '#52c41a'; text = '强';
      } else {
        percent = 100; color = '#13c2c2'; text = '极强';
      }

      fill.style.width = percent + '%';
      fill.style.background = color;
      label.textContent = `${text} (${Math.round(entropy)} bits)`;
    }

    function copyPassword() {
      const text = document.getElementById('passwordText').textContent;
      if (text === '点击生成') return;

      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '复制';
          btn.classList.remove('copied');
        }, 1500);
      });
    }
  </script>
</body>
</html>
